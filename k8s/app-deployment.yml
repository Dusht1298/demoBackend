apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      initContainers:
        # Waits for MySQL to be ready before starting the app
        - name: wait-for-mysql
          image: busybox
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done']
        # Waits for Kafka to be ready before starting the app
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka-svc 9092; do echo waiting for kafka; sleep 3; done']
      containers:
        - name: demo-app
          image: demo-app:latest          # we'll load this from local build
          imagePullPolicy: Never          # use local image, don't pull from registry
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/testdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "Dushyant@1298"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-svc:9092"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: NodePort                    # exposes app outside the cluster
  selector:
    app: demo-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080               # access via minikube-ip:30080
