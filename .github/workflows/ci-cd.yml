name: Backend CI/CD

# Runs on every push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ──────────────────────────────────────────
  # JOB 1: Build & Test the Spring Boot app
  # ──────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code onto the CI runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21 (same version as your Dockerfile)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven        # caches Maven deps so next run is faster

      # 3. Build the JAR and run tests
      - name: Build with Maven
        run: ./mvnw clean package

      # 4. Save the JAR so the next job can use it
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ──────────────────────────────────────────
  # JOB 2: Build Docker image & push to Docker Hub
  # Only runs on push to main (not on PRs)
  # ──────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test                          # waits for Job 1 to pass
    if: github.ref == 'refs/heads/main'            # skip on pull requests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the JAR built in Job 1
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Log in to Docker Hub using secrets you'll set in GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push with two tags:
      #   latest        → always points to the newest build
      #   <commit-sha>  → pinned tag so you can roll back to any exact commit
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/demo-app:latest
            ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}